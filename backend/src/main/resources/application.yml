server:
  port: 8080
spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/nhl;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: always
analytics:
  odds-api-key: ${ODDS_API_KEY:}
  odds-regions: ${ODDS_REGIONS:eu}
  scheduler-enabled: ${SCHEDULER_ENABLED:true}
  refresh-minutes: ${REFRESH_MINUTES:30}
  odds-max-age-minutes: ${ODDS_MAX_AGE_MINUTES:60}
  min-games-per-team: ${MIN_GAMES_PER_TEAM:8}
  min-ev-pct: ${MIN_EV_PCT:3.0}
  min-settled-for-validation: ${MIN_SETTLED_FOR_VALIDATION:300}
  backfill-from: ${BACKFILL_FROM:2025-10-01}
  odds-min-interval-minutes: ${ODDS_MIN_INTERVAL_MINUTES:240}
  closing-capture: ${CLOSING_CAPTURE:false}
  clv-reference-provider: ${CLV_REFERENCE_PROVIDER:pinnacle}
  odds-markets: ${ODDS_MARKETS:h2h}
  oddspapi-key: ${ODDSPAPI_KEY:}
  oddspapi-bookmakers: ${ODDSPAPI_BOOKMAKERS:}
